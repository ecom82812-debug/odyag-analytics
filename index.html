<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аналітика одягу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root {
  color-scheme: light;
  /* Палітра «слива й пудра» — щоб не плутати з дашбордом конструкторів */
  --bg: #f5f3f4;
  --surface: #ffffff;
  --surface-2: #faf8f9;
  --surface-3: #f1edef;
  --line: #ebe5e8;
  --line-2: #ddd5da;
  --ink: #1f1a21;
  --ink-2: #544a55;
  --ink-3: #8c8290;
  --brand: #e9b8c9;
  --brand-ink: #2a1d2c;
  --brand-soft: #fbeef3;
  --nav-bg: #231a26;
  --nav-on: #3a2d3e;
  --hero-bg: #2d2131;
  --nav-ink: #b8adb9;
  --nav-ink-strong: #ffffff;
  --nav-hover: #2f2433;
  --s1: #6d4f93;
  --s2: #d9728f;
  --s3: #3f9a8c;
  --grid: #efeaec;
  --good: #0e8a4a; --good-bg: #e5f5ec;
  --bad: #cf3a2d;  --bad-bg: #fcebe9;
  --warn: #a86b00; --warn-bg: #fdf2d9;
  --bar: #cdbde0;
  --bar-neg: #f2b1aa;
  --spark: #e9b8c9;
  --shadow: 0 1px 2px rgba(31,26,33,.04), 0 2px 8px rgba(31,26,33,.05);
  --shadow-pop: 0 12px 32px rgba(31,26,33,.16), 0 2px 6px rgba(31,26,33,.08);
  --r: 14px;
  --r-sm: 9px;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Manrope", "Onest", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121014; --surface: #1b171d; --surface-2: #201b22; --surface-3: #282229;
    --line: #2f2831; --line-2: #3b333e;
    --ink: #f5f2f5; --ink-2: #bdb3bf; --ink-3: #85798a;
    --brand-soft: #3a2430; --nav-bg: #0f0c10; --nav-on: #2a2130; --hero-bg: #2a2130; --nav-hover: #1c171e;
    --s1: #9a7fc0; --s2: #e48aa4; --s3: #56b3a4; --grid: #282229;
    --good: #5bd08f; --good-bg: #13301f; --bad: #f28b80; --bad-bg: #3a1b18; --warn: #f1bd5b; --warn-bg: #372a10;
    --bar: #5d4a7a; --bar-neg: #9c3e36;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-pop: 0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121014; --surface: #1b171d; --surface-2: #201b22; --surface-3: #282229;
  --line: #2f2831; --line-2: #3b333e;
  --ink: #f5f2f5; --ink-2: #bdb3bf; --ink-3: #85798a;
  --brand-soft: #3a2430; --nav-bg: #0f0c10; --nav-on: #2a2130; --hero-bg: #2a2130; --nav-hover: #1c171e;
  --s1: #9a7fc0; --s2: #e48aa4; --s3: #56b3a4; --grid: #282229;
  --good: #5bd08f; --good-bg: #13301f; --bad: #f28b80; --bad-bg: #3a1b18; --warn: #f1bd5b; --warn-bg: #372a10;
  --bar: #5d4a7a; --bar-neg: #9c3e36;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-pop: 0 12px 32px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.tnum, td.n, th.n, .kpi-v, .val { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================= каркас ================= */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 18px 12px 14px; gap: 4px;
}
/* Меню прокручується, якщо не вміщається; низ меню (статус, «Оновити дані», вихід) завжди видно */
.side > .nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; scrollbar-color: #4a3d4d transparent; }
.side > .side-foot { flex: none; }
@media (min-width: 861px) and (max-height: 900px) {
  .side { padding: 12px 12px 10px; }
  .logo { padding-bottom: 8px; }
  .nav-g { padding: 8px 10px 3px; }
  .nav a { padding: 6px 10px; }
  .side-foot { gap: 6px; padding-top: 8px; }
  .side-btn { padding: 7px 12px; }
}
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.logo-mark { width: 34px; height: 34px; flex: none; }
.logo-t { font-family: var(--display); font-weight: 600; font-size: 13.5px; color: var(--nav-ink-strong); letter-spacing: .01em; line-height: 1.15; }
.logo-s { font-size: 11.5px; color: var(--nav-ink); margin-top: 2px; }
.nav-g { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #7d6f80; padding: 14px 10px 6px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--nav-ink);
  text-decoration: none; font-size: 13.5px; position: relative; cursor: pointer;
}
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav a:hover { background: var(--nav-hover); color: var(--nav-ink-strong); }
.nav a.on { background: var(--nav-on); color: var(--nav-ink-strong); font-weight: 550; }
.nav a.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 6px 0; border-top: 1px solid #22262d; }
.sync-pill { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--nav-ink); padding: 4px 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3dbb74; flex: none; box-shadow: 0 0 0 3px rgba(61,187,116,.18); }
.dot.warn { background: #f1bd5b; box-shadow: 0 0 0 3px rgba(241,189,91,.18); }
.dot.bad { background: #f28b80; box-shadow: 0 0 0 3px rgba(242,139,128,.18); }
.dot.spin { animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
.side-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 9px; padding: 9px 12px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; font-size: 13px; }
.side-btn svg { width: 16px; height: 16px; flex: none; }
.side-btn:hover { filter: brightness(1.05); }
.side-btn:disabled { opacity: .6; cursor: default; }
.side-user { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6c727d; padding: 2px 4px; gap: 6px; }
.side-user button { background: none; border: 0; color: var(--nav-ink); cursor: pointer; padding: 2px 4px; font-size: 12px; }
.side-user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { min-width: 0; padding: 22px 28px 60px; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-t { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.page-s { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-bar { background: var(--brand-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent); border-radius: 12px; padding: 9px 14px; font-size: 13px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
.demo-bar b { font-weight: 650; }

/* ================= кнопки й поля ================= */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 7px 12px; cursor: pointer; font-size: 13px; min-height: 36px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.btn.primary:hover { opacity: .9; }
.btn.yellow { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
.icon-btn { border: 0; background: none; color: var(--ink-3); cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
input[type=text], input[type=number], input[type=date], input[type=month], input[type=email], input[type=password], select, textarea {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; min-height: 36px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--s1) 45%, transparent); border-color: var(--s1); }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 500; min-width: 0; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); align-items: end; }
.form .wide { grid-column: span 2; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 550; }

/* період */
.period { position: relative; }
.period-btn { min-width: 220px; justify-content: space-between; }
.period-btn .lbl { font-weight: 600; }
.period-btn .rng { color: var(--ink-3); font-size: 12px; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); width: 280px; padding: 6px; }
.pop button.row { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; }
.pop button.row:hover { background: var(--surface-2); }
.pop button.row.on { font-weight: 650; }
.pop button.row .ck { width: 16px; height: 16px; opacity: 0; }
.pop button.row.on .ck { opacity: 1; }
.pop .custom { border-top: 1px solid var(--line); margin-top: 6px; padding: 10px 6px 4px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.pop .custom .btn { grid-column: span 2; justify-content: center; }

/* ================= картки ================= */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-t { font-weight: 650; font-size: 14.5px; margin: 0; }
.card-s { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.neg { color: var(--bad); }
.pos { color: var(--good); }
.loading-veil { transition: opacity .2s; }
.is-loading .loading-veil { opacity: .5; pointer-events: none; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px 12px; box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.kpi-l { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 6px; color: var(--ink-2); font-size: 12.5px; }
.kpi-v { font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-s { color: var(--ink-3); font-size: 12px; }
.kpi.hero { grid-column: span 2; background: var(--hero-bg); color: #fff; border-color: var(--hero-bg); position: relative; overflow: hidden; }
.kpi.hero .kpi-l, .kpi.hero .kpi-s { color: rgba(255,255,255,.7); }
.kpi.hero .kpi-v { font-family: var(--display); font-weight: 600; font-size: 28px; letter-spacing: -.02em; }
.kpi.hero .kpi-v.neg { color: #ff9b90; }
.kpi.hero .spark { display: block; width: 100%; height: 38px; margin-top: 8px; }
.kpi.hero .studs { position: absolute; right: 14px; top: 14px; display: grid; grid-template-columns: repeat(2, 9px); gap: 5px; }
.kpi.hero .studs i { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); display: block; }
.delta { font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 999px; white-space: nowrap; flex: none; line-height: 18px; }
.delta.up { color: var(--good); background: var(--good-bg); }
.delta.down { color: var(--bad); background: var(--bad-bg); }
.delta.flat { color: var(--ink-3); background: var(--surface-3); }
.kpi.hero .delta { background: rgba(255,255,255,.12); color: #fff; }
.kpi .target { font-size: 11.5px; }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; line-height: 18px; }
.flag.good { color: var(--good); background: var(--good-bg); }
.flag.bad { color: var(--bad); background: var(--bad-bg); }
.flag.warn { color: var(--warn); background: var(--warn-bg); }

/* графіки */
.chart { position: relative; height: 290px; }
.chart.sm { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.box { width: 10px; height: 10px; border-radius: 3px; }

/* P&L */
.pl { width: 100%; border-collapse: collapse; }
.pl td { padding: 7px 0; border-bottom: 1px solid var(--grid); vertical-align: middle; font-size: 13px; }
.pl tr:last-child td { border-bottom: 0; }
.pl td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
.pl td.p { text-align: right; color: var(--ink-3); width: 44px; font-size: 12px; }
.pl .bc { width: 30%; padding-left: 12px; }
.pl .b { height: 8px; border-radius: 4px; background: var(--bar); min-width: 2px; }
.pl .b.neg { background: var(--bar-neg); }
.pl tr.tot td { font-weight: 700; }
.pl tr.tot.final td { border-top: 2px solid var(--ink); font-size: 14px; }
.pl tr.sub td:first-child { padding-left: 14px; color: var(--ink-2); }

/* таблиці */
.tw { overflow-x: auto; margin: 0 -6px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; letter-spacing: .02em; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
table.t th.sort { cursor: pointer; user-select: none; }
table.t th.sort:hover { color: var(--ink); }
table.t th.sorted { color: var(--ink); }
table.t td { padding: 8px 8px; border-bottom: 1px solid var(--grid); }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); border-bottom: 0; background: var(--surface-2); }
table.t .name { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl-scroll { max-height: 560px; overflow: auto; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; }
.pill.success { background: var(--good-bg); color: var(--good); }
.pill.fail, .pill.return { background: var(--bad-bg); color: var(--bad); }
.pill.work { background: var(--surface-3); color: var(--ink-2); }
.pill.ignore { background: var(--surface-3); color: var(--ink-3); text-decoration: line-through; }
.minibar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; min-width: 60px; }
.minibar i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }

.hb { display: grid; grid-template-columns: minmax(100px, 40%) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.hb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hb .tr { height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; }
.hb .fl { height: 100%; background: var(--s1); border-radius: 5px; }
.hb .fl.s2 { background: var(--s2); }
.hb .val { text-align: right; white-space: nowrap; }

/* воронка */
.funnel { display: flex; flex-direction: column; gap: 8px; }
.fstep { display: grid; grid-template-columns: 120px 1fr 90px; gap: 10px; align-items: center; font-size: 13px; }
.fstep .fb { height: 26px; border-radius: 7px; background: var(--s1); display: flex; align-items: center; padding: 0 8px; color: #fff; font-weight: 600; font-size: 12px; min-width: 34px; }
.fstep .fb.s2 { background: var(--s3); }
.fstep .fb.s4 { background: var(--brand); color: var(--brand-ink); }
.cell-edit { border: 1px dashed var(--line-2); background: var(--surface-2); border-radius: 7px; padding: 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell-edit:hover { border-color: var(--s1); background: var(--surface); }
.cell-edit svg { width: 13px; height: 13px; color: var(--ink-3); }
.ad-pop { text-align: left; font-weight: 400; }
.warn-t { color: var(--warn); font-weight: 600; }
.fstep .fb.s3 { background: var(--bar-neg); color: var(--ink); }

.stat-list { display: flex; flex-direction: column; }
.stat-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.stat-row:last-child { border-bottom: 0; }
.stat-row b { font-weight: 650; }

/* менеджери */
.mgr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mgr-card .ava { width: 38px; height: 38px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 600; }
.mgr-pay { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 10px 0 6px; }

.hint { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink-2); font-size: 13px; }
.hint.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.empty { text-align: center; color: var(--ink-3); padding: 28px 10px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 100; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--bad); color: #fff; }
.tip { white-space: pre-line; position: fixed; z-index: 90; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-pop); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: none; max-width: 280px; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,11,13,.45); display: grid; place-items: center; z-index: 80; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 20px; width: 100%; max-width: 380px; }
.modal h3 { margin: 0 0 6px; font-size: 16px; }
.modal p { margin: 0 0 16px; color: var(--ink-2); font-size: 13.5px; }

.progress { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }

/* вхід */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--nav-bg); }
.login form { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-pop); }
.login h1 { font-family: var(--display); font-size: 19px; margin: 6px 0 0; font-weight: 600; }
.login .err { color: var(--bad); font-size: 13px; min-height: 18px; }

/* ================= адаптив ================= */
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; }
  .c3 { grid-column: span 6; }
}
/* нижня панель і меню «Ще» — лише на телефоні/планшеті */
.tabbar, .sheet { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  /* верхня смужка: логотип, назва, стан синхронізації, кнопка оновлення */
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px; gap: 10px; overflow: visible; }
  .side > .nav, .side-user, .sync-pill span { display: none; }
  .logo { padding: 0; gap: 10px; flex: 1; min-width: 0; }
  .logo-s { display: none; }
  .logo-t { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot { margin: 0; flex-direction: row; align-items: center; border: 0; padding: 0; gap: 10px; }
  .side-btn { padding: 8px 12px; }
  .side-btn span { display: inline; }
  .main { padding: 16px 14px calc(88px + env(safe-area-inset-bottom, 0px)); border-top-width: 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi.hero { grid-column: 1 / -1; }
  .c3 { grid-column: span 12; }
  .pl .bc, .pl td.p { display: none; }
  .form .wide { grid-column: auto; }

  /* заголовок сторінки і перемикачі: на всю ширину, магазини гортаються пальцем */
  .topbar { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 14px; }
  .page-t { font-size: 21px; }
  .topbar > * { min-width: 0; max-width: 100%; }
  .tools { flex-direction: column; align-items: stretch; gap: 8px; width: 100%; }
  .tools > * { min-width: 0; max-width: 100%; }
  .tools > .seg { display: flex; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; max-width: 100%; }
  .tools > .seg::-webkit-scrollbar { display: none; }
  .tools > .seg { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .tools > .seg button { flex: none; padding: 8px 12px; font-size: 13px; }
  .period, .period-btn { width: 100%; min-width: 0; }
  .period-btn { padding: 10px 12px; }
  .period .pop { left: 0; right: 0; width: auto; }

  /* нижня панель як у застосунку */
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: color-mix(in srgb, var(--nav-bg) 96%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(255,255,255,.06); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--nav-ink); font: inherit; font-size: 10.5px; text-decoration: none; border-radius: 12px; cursor: pointer; min-width: 0; }
  .tabbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar .on { color: var(--nav-ink-strong); }
  .tabbar .on svg { color: var(--brand); }

  /* меню «Ще» знизу */
  .sheet:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 70; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(15,10,16,.45); }
  .sheet-body { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-pop); animation: sheetUp .22s ease-out; }
  .sheet-h { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px 6px; font-family: var(--display); font-size: 17px; }
  .sheet-h .icon-btn svg { width: 20px; height: 20px; }
  .sheet-g { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 12px 2px 6px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .sheet-grid a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px; min-height: 76px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 12px; text-align: center; line-height: 1.2; }
  .sheet-grid a svg { width: 22px; height: 22px; color: var(--ink-2); }
  .sheet-grid a.on { background: var(--brand-soft); border-color: var(--brand); }
  .sheet-grid a.on svg { color: var(--ink); }
  .sheet-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .sheet-foot .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.sheet-open { overflow: hidden; }
}
@keyframes sheetUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }


/* розбивка витрат */
.has-tip { border-bottom: 1px dotted var(--ink-3); cursor: help; }
.exp-h { display: flex; justify-content: space-between; margin-top: 12px; padding: 8px 0 4px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.exp-h b { color: var(--ink); font-size: 13px; text-transform: none; letter-spacing: 0; }
.exp-list .stat-row span:first-child { color: var(--ink-2); }
/* налаштування стовпців */
.col-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; border: 1px solid transparent; background: var(--surface); }
.col-row:not(.fixed) { cursor: grab; }
.col-row:not(.fixed):hover { background: var(--surface-2); }
.col-row.fixed { opacity: .6; }
.col-row .grip { width: 16px; height: 16px; color: var(--ink-3); display: inline-flex; }
.col-row .grip svg { width: 16px; height: 16px; }
.col-row .nm { flex: 1; }
.col-row input { accent-color: var(--s1); width: 15px; height: 15px; margin: 0; }
.col-row .arr { display: inline-flex; gap: 2px; }
.col-row .arr button { border: 0; background: none; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.col-row .arr button:hover:not(:disabled) { background: var(--surface-3, var(--line)); }
.col-row .arr button:disabled { opacity: .25; cursor: default; }
.col-row .arr svg { width: 15px; height: 15px; }
.col-row .arr .dn svg { transform: rotate(180deg); }
.col-row.dragging { opacity: .4; }
.col-row.over-top { border-top: 2px solid var(--s1); border-radius: 0; }
.col-row.over-bot { border-bottom: 2px solid var(--s1); border-radius: 0; }

/* кольори магазинів */
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); margin-right: 6px; vertical-align: 1px; flex: none; }
.stag { white-space: nowrap; }
.seg button .sdot { opacity: .55; }
.seg button.on .sdot { opacity: 1; }
.seg button.on[style*="--sc"] { box-shadow: var(--shadow), inset 0 -2px 0 var(--sc); }
tr.shared td { color: var(--ink-3); }
tr.shared td b { color: var(--ink-3); }
#main { border-top: 3px solid var(--store-accent, transparent); transition: border-color .2s; }
/* По днях: чистий прибуток підсвічено */
:root { --net-bg: rgba(25, 158, 112, .08); }
.t th.col-net, .t td.col-net { background: var(--net-bg); }
.t tfoot td.col-net { background: rgba(25, 158, 112, .14); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --net-bg: rgba(25, 158, 112, .13); } }
:root[data-theme="dark"] { --net-bg: rgba(25, 158, 112, .13); }
.stat-row.sub span { padding-left: 12px; color: var(--ink-3); }
.stat-row.sub b { font-weight: 500; color: var(--ink-2); }
.limbar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.limbar i { display: block; height: 100%; border-radius: 4px; background: var(--s3); }
.limbar i.warn { background: var(--warn); }
.limbar i.bad { background: var(--bad); }
.taxpaid { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--warn); background: var(--warn-bg); cursor: pointer; font-size: 13px; }
.taxpaid input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--good); flex: none; cursor: pointer; }
.taxpaid .small { color: var(--ink-2); }
.taxpaid.on { border-color: var(--good); background: var(--good-bg); }

/* ---------- Графік змін ---------- */
.shift-card { margin-bottom: 14px; }
.sh-nav { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.sh-nav b { min-width: 120px; text-align: center; font-family: var(--display); }
.sh-nav .icon-btn { font-size: 18px; line-height: 1; width: 30px; height: 30px; }
.sh-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 4px 0 14px; }
.sh-m { background: color-mix(in srgb, var(--c) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); border-radius: 12px; padding: 10px 12px; }
.sh-mn { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
.sh-mn i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.sh-mv { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 2px 0; }
.sh-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sh-wd { font-size: 12px; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.sh-d { --c: var(--ink-3); position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 82px; padding: 7px 8px; border-radius: 10px; text-align: left; cursor: pointer; font: inherit;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); transition: transform .12s, box-shadow .12s; min-width: 0; }
.sh-d:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.sh-d.fact[style*="--c"] { background: color-mix(in srgb, var(--c) 15%, var(--surface)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.sh-d.plan[style*="--c"] { background: color-mix(in srgb, var(--c) 5%, var(--surface)); border: 1px dashed color-mix(in srgb, var(--c) 55%, var(--line)); }
.sh-d.split { background: linear-gradient(135deg, color-mix(in srgb, var(--c) 17%, var(--surface)) 50%, color-mix(in srgb, var(--c2) 17%, var(--surface)) 50%) !important; }
.sh-d.today { box-shadow: 0 0 0 2px var(--ink); }
.sh-n { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 4px; }
.sh-pin { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.sh-nm { font-weight: 650; font-size: 13px; margin-top: auto; color: color-mix(in srgb, var(--c) 65%, var(--ink)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sh-s { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sh-s b { color: var(--warn); font-weight: 600; }
.sh-h { font-size: 10.5px; color: var(--ink-3); }
.sh-d.plan .sh-h, .sh-d.fact:not([style*="--c"]) .sh-h { opacity: .8; }
.sh-lg { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.sh-lg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.sh-lg .lg-f { background: color-mix(in srgb, var(--s1) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--s1) 45%, var(--line)); }
.sh-lg .lg-p { border: 1px dashed var(--ink-3); }
.sh-lg .lg-s { background: linear-gradient(135deg, color-mix(in srgb, var(--s2) 25%, var(--surface)) 50%, color-mix(in srgb, var(--s1) 25%, var(--surface)) 50%); }
.sh-pl { padding: 2px 8px 4px; display: flex; flex-direction: column; gap: 8px; }
.sh-pr > div:first-child { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.sh-pr > div:first-child span { margin-left: auto; font-weight: 600; }
.sh-pr .small { padding-left: 15px; }
.sh-nm .short { display: none; }
@media (max-width: 700px) {
  .sh-grid { gap: 3px; } .sh-d { min-height: 58px; padding: 4px 5px; border-radius: 8px; }
  .sh-h, .sh-s { display: none; } .sh-nm { font-size: 11px; } .sh-nm .full { display: none; } .sh-nm .short { display: inline; }
}
.seg .shift-tab { display: inline-flex; align-items: center; gap: 6px; }
.seg .shift-tab svg { width: 15px; height: 15px; }

/* телефон */
@media (max-width: 700px) {
  .card { padding: 14px; border-radius: 14px; }
  .card-t { font-size: 15.5px; }
  .kpi { padding: 11px 12px 10px; }
  .kpi-v { font-size: 19px; }
  .kpi.hero .kpi-v { font-size: 26px; }
  .kpi-l { font-size: 12px; }
  .kpi-s { font-size: 11.5px; }
  .grid, .row { gap: 10px; }
  .pop { max-width: calc(100vw - 24px); }
  input, select, textarea { font-size: 16px; } /* iPhone не збільшує сторінку при введенні */
  .btn { min-height: 38px; }
  .card-h { gap: 8px; }
  .card-h > * { min-width: 0; max-width: 100%; }
  .seg { max-width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; }

  /* широкі таблиці → картки */
  table.t.stack, .t.stack tbody, .t.stack tfoot { display: block; width: 100%; }
  .t.stack thead { display: none; }
  .t.stack tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .t.stack td { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 0; border: 0; text-align: left !important; white-space: normal; min-width: 0; overflow-wrap: anywhere; background: none !important; }
  .t.stack td::before { content: attr(data-label); font-size: 11px; font-weight: 500; color: var(--ink-3); text-transform: none; }
  .t.stack td[data-label=""]::before, .t.stack td.span::before { display: none; }
  .t.stack td:first-child { grid-column: 1 / -1; font-weight: 650; font-size: 14px; }
  .t.stack td:first-child::before { display: none; }
  .t.stack td:first-child:has(input[type="checkbox"]) { grid-column: auto; order: 90; flex-direction: row; align-items: center; font-size: inherit; }
  .t.stack td.span { grid-column: 1 / -1; padding: 6px 2px; }
  .t.stack td:last-child:has(> button), .t.stack td:last-child:has(> .icon-btn) { grid-column: 1 / -1; flex-direction: row; justify-content: flex-end; gap: 6px; }
  .t.stack tfoot tr { background: var(--surface-2); border-radius: 10px; margin-top: 6px; }
  .tw:has(> .t.stack), .tbl-scroll:has(> .t.stack) { overflow-x: visible; margin: 0; }

  /* таблиці-звіти: гортаються вбік, перший стовпець закріплений */
  .t.stick1 th:first-child, .t.stick1 td:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
  .t.stick1 thead th:first-child { z-index: 3; }
  .t.stick1 th, .t.stick1 td { padding-left: 8px; padding-right: 8px; }
  .t.stick1 { font-size: 12.5px; }

  /* графік змін: підсумки в один ряд */
  .sh-sum { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px; }
  .sh-m { padding: 8px 9px; border-radius: 10px; }
  .sh-mn { font-size: 12px; } .sh-mn .muted { display: none; }
  .sh-mv { font-size: 17px; }
  .sh-m .small { font-size: 10.5px; line-height: 1.3; }
  .sh-nav b { min-width: 0; }
  .shift-card .card-h { flex-direction: column; align-items: stretch; }
  .shift-card .sh-nav { justify-content: space-between; }
}

/* Поля дати й місяця: у Safari на iPhone вони не стискаються і розпирають сторінку */
input[type="date"], input[type="month"], input[type="datetime-local"] { min-width: 0; max-width: 100%; box-sizing: border-box; }
.month-in { width: 170px; }
@media (max-width: 860px) {
  input[type="date"], input[type="month"], input[type="datetime-local"] { -webkit-appearance: none; appearance: none; width: 100%; display: block; min-height: 42px; text-align: left; background-color: var(--surface); }
  input::-webkit-date-and-time-value { text-align: left; margin: 0; }
  .month-in { width: 100%; max-width: 220px; }
  label.f, .form > * { min-width: 0; }
  .form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form > .btn, .form > button { grid-column: 1 / -1; justify-content: center; }
  html, body { overflow-x: clip; max-width: 100%; }
}

/* ---------- Виплати менеджерам ---------- */
.pay-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.pay-sec { padding: 12px 0; border-top: 1px solid var(--line); }
.pay-sec:first-of-type { border-top: 0; padding-top: 0; }
.pay-l { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; }
.pay-dates { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; max-width: 380px; margin-bottom: 6px; }
.pay-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; margin: 8px 0 6px; }
.pb-d { height: 30px; border-radius: 6px; border: 1px solid transparent; font: inherit; font-size: 11px; cursor: pointer; padding: 0; color: var(--ink-2); background: var(--surface-3); opacity: .55; }
.pb-d.in { opacity: 1; }
.pb-d.done { background: color-mix(in srgb, var(--good) 22%, var(--surface)); color: var(--good); }
.pb-d.pend { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn); }
.pb-d.in { border-color: color-mix(in srgb, var(--ink) 35%, transparent); }
.pay-lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-3); }
.pay-lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--surface-3); }
.pay-lg i.done { background: color-mix(in srgb, var(--good) 35%, var(--surface)); } .pay-lg i.pend { background: color-mix(in srgb, var(--warn) 35%, var(--surface)); }
.adj-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; margin-bottom: 6px; }
.adj-row input.neg { color: var(--bad); }
.pay-sum { position: sticky; top: 14px; }
.pay-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 10px; }
.pay-total b { font-family: var(--display); font-size: 26px; }
.pay-text { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12.5px/1.5 var(--font); color: var(--ink-2); margin: 12px 0; }
.pay-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay-btns .btn { justify-content: center; }
.stat-row b.pos { color: var(--good); } .stat-row b.neg, td.neg { color: var(--bad); }
@media (max-width: 860px) { .pay-grid { grid-template-columns: minmax(0, 1fr); } .pay-sum { position: static; } }
@media (max-width: 700px) { .adj-row { grid-template-columns: minmax(0, 1fr) 90px auto; } .pay-btns { grid-template-columns: 1fr; } }
.rate-hist { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.rate-hist .rh { white-space: nowrap; }
.rate-hist .icon-btn { width: 22px; height: 22px; vertical-align: middle; }

</style>

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<script>
// ===================== ДЕМО-ДАНІ =====================
// Працює, коли в CONFIG не вказано Supabase. Імітує ту саму базу й SQL-функції.
function createDemoApi() {
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const w = (pairs) => { let x = rnd() * pairs.reduce((s, p) => s + p[1], 0); for (const [v, k] of pairs) if ((x -= k) < 0) return v; return pairs[0][0]; };
  const pad = (n) => String(n).padStart(2, '0');
  const ymdL = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  const PRODUCTS = [
    ['Конструктор «Пожежна станція» 820 дет.', 1890], ['Конструктор «Космічний шатл» 1100 дет.', 2650], ['Конструктор «Замок лицаря» 950 дет.', 2190],
    ['Конструктор «Гоночне авто» 420 дет.', 890], ['Конструктор «Динозавр T-Rex» 380 дет.', 790], ['Конструктор «Поліцейська дільниця» 700 дет.', 1590],
    ['Конструктор «Ферма» 310 дет.', 690], ['Конструктор «Робот-трансформер» 560 дет.', 1190], ['Магнітний конструктор 64 дет.', 1290],
    ['Магнітний конструктор 120 дет.', 2190], ["Дерев'яний конструктор «Місто» 150 дет.", 990], ['Конструктор для малюків 48 дет.', 490],
    ['Технічний конструктор «Екскаватор» 1300 дет.', 3490], ['Технічний конструктор «Кран» 1800 дет.', 4290], ['Конструктор «Піратський корабель» 1250 дет.', 2890],
    ["Конструктор «Кав'ярня» 520 дет.", 1090], ['Набір мініфігурок 12 шт.', 390], ['Електронний конструктор «Юний інженер»', 1690],
    ['Конструктор «Вантажівка-сміттєвоз» 610 дет.', 1390], ['Конструктор «Аеропорт» 1450 дет.', 3190],
  ];
  const REASONS = ['Не відповідає на дзвінки', 'Передумав', 'Дорога доставка', 'Знайшов дешевше', 'Не забрав з пошти', 'Товар не сподобався'];
  const statuses = [
    { id: 1, name: 'Новий', type: 1, category: 'work', confirmed: false, manual: false, sort: 0 },
    { id: 2, name: 'Підтверджено', type: 1, category: 'work', confirmed: true, manual: false, sort: 1 },
    { id: 3, name: 'Відправлено', type: 1, category: 'work', confirmed: true, manual: false, sort: 2 },
    { id: 4, name: 'Продаж', type: 2, category: 'success', confirmed: true, manual: false, sort: 3 },
    { id: 5, name: 'Відмова', type: 3, category: 'fail', confirmed: false, manual: false, sort: 4 },
    { id: 6, name: 'Повернення', type: 3, category: 'return', confirmed: false, manual: false, sort: 5 },
    { id: 7, name: 'Дубль / видалено', type: 4, category: 'ignore', confirmed: false, manual: false, sort: 6 },
  ];
  const managers = [
    { id: 3, name: 'Олена', rate_per_order: 18, upsell_pct: 0.2, active: true },
    { id: 4, name: 'Максим', rate_per_order: 18, upsell_pct: 0.2, active: true },
    { id: 5, name: 'Ірина', rate_per_order: 16, upsell_pct: 0.25, active: true },
  ];
  const stores = [
    { id: 21, name: 'BrickLand', active: true, sort: 0 },
    { id: 22, name: 'Кубик', active: true, sort: 1 },
  ];
  const orders = [], items = [];
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 420);
  let id = 50000;
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const age = Math.round((today - d) / 86400e3);
    const m = d.getMonth();
    const season = 1 + 0.3 * Math.cos((m - 11) / 12 * 2 * Math.PI) + (m === 11 ? 0.45 : 0) + (m === 8 ? 0.15 : 0);
    const growth = 0.75 + 0.35 * (1 - age / 420);
    const n = Math.round((10 + rnd() * 9) * season * growth * ([0, 6].includes(d.getDay()) ? 1.2 : 1));
    for (let k = 0; k < n; k++) {
      id++;
      const sajt = rnd() < 0.62 ? 21 : 22;
      const src = sajt === 21 ? w([['facebook', 26], ['instagram', 18], ['google', 30], ['sms', 6], [null, 20]]) : w([['facebook', 22], ['instagram', 20], ['tiktok', 40], [null, 18]]);
      const cnt = w([[1, 68], [2, 23], [3, 9]]);
      const its = [];
      for (let j = 0; j < cnt; j++) {
        const pi = Math.floor(rnd() * PRODUCTS.length);
        const [name, price] = PRODUCTS[pi];
        its.push({ pi, name, price, qty: rnd() < 0.08 ? 2 : 1, cost: Math.round(price * (0.54 + rnd() * 0.12)), pre: j > 0 && rnd() < 0.5 });
      }
      const amount = its.reduce((s, i) => s + i.price * i.qty, 0);
      const cost = its.reduce((s, i) => s + i.cost * i.qty, 0);
      const cod = rnd() < 0.6;
      let st;
      if (age > 14) st = w([[4, 70], [5, 15], [6, 10], [7, 5]]);
      else if (age > 5) st = w([[4, 42], [3, 32], [5, 12], [6, 4], [7, 4], [2, 6]]);
      else st = w([[1, 22], [2, 30], [3, 30], [4, 6], [5, 8], [7, 4]]);
      const ship = amount >= 1500 ? 70 + Math.round(rnd() * 45) : 0;
      const comm = cod ? Math.round(amount * 0.02 + 20) : Math.round(amount * 0.013);
      const pd = new Date(d); pd.setDate(pd.getDate() + 2 + Math.floor(rnd() * 4));
      const sale = st === 4;
      const payed = sale ? (rnd() < 0.97 ? amount : 0) : (!cod && st === 3 ? amount : 0);
      const upsell = its.filter((i) => i.pre).reduce((s, i) => s + i.price * i.qty, 0);
      orders.push({
        id, order_date: ymdL(d), order_time: `${ymdL(d)} ${pad(8 + Math.floor(rnd() * 14))}:${pad(Math.floor(rnd() * 60))}:00`,
        payment_date: sale ? (pd > today ? ymdL(today) : ymdL(pd)) : null, status_id: st,
        payment_amount: amount, cost_price: cost, shipping_costs: st === 6 ? ship + 110 : (sale ? ship : 0), commission: sale ? comm : 0, expenses_amount: 0,
        payed_amount: payed, rest_pay: (sale || st === 3) ? amount - payed : 0, upsell_amount: upsell,
        rejection_reason: st === 5 || st === 6 ? pick(REASONS) : null, utm_source: src,
        ttn: st >= 3 && st !== 7 ? '2045' + id : null, delivery_cost: (st === 5 || st === 6) && rnd() < 0.85 ? 120 + Math.round(rnd() * 90) : 0,
        sajt, manager_id: sajt === 21 ? w([[3, 60], [4, 40]]) : w([[4, 30], [5, 70]]), payment_method: cod ? 'Накладений платіж' : pick(['Оплата на картку', 'LiqPay', 'Monobank']),
      });
      its.forEach((i, pos) => items.push({ order_id: id, pos, product_id: i.pi + 1, name: i.name, sku: 'KB-' + (100 + i.pi), amount: i.qty, price: i.price, cost_price: i.cost }));
    }
  }
  const byId = new Map(orders.map((o) => [o.id, o]));
  const cat = (o) => statuses.find((s) => s.id === o.status_id)?.category || 'work';
  const conf = (o) => !!statuses.find((s) => s.id === o.status_id)?.confirmed;

  // Витрати: реклама щотижня (Meta в $), SMS щомісяця, блогери
  const expenses = []; let eid = 1;
  const settings = {
    finance_date: 'order', usd_rate: 41.5, eur_rate: 45, store_name: 'Магазин конструкторів',
    expense_categories: ['Реклама', 'Податки', 'SMS-розсилки', 'Оренда / склад', 'Пакування', 'Сервіси (CRM, сайт)', 'Банк / еквайринг', 'Інше'],
    ad_channels: ['Meta', 'Google', 'TikTok', 'Блогери', 'Розсилки', 'Інше'],
    targets: { romi: 1.0, cpo: 300, conversion: 0.6 }, managers_in_pnl: true,
    backfill_done: true, last_sync: new Date(Date.now() - 6 * 60e3).toISOString(), last_run: new Date(Date.now() - 6 * 60e3).toISOString(),
  };
  const addExp = (date, date_to, category, channel, amount, currency, comment, store_id = null) => {
    const rate = currency === 'USD' ? 41.5 : 1;
    expenses.push({ id: eid++, date, date_to, category, channel, amount, currency, rate, amount_uah: Math.round(amount * rate * 100) / 100, comment, store_id, created_at: date });
  };
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 7)) {
    const e = new Date(d); e.setDate(e.getDate() + 6);
    const to = e > today ? ymdL(today) : ymdL(e);
    addExp(ymdL(d), to, 'Реклама', 'Meta', Math.round(140 + rnd() * 60), 'USD', 'Facebook + Instagram', 21);
    addExp(ymdL(d), to, 'Реклама', 'Google', Math.round(6000 + rnd() * 3000), 'UAH', 'Google Ads', 21);
    addExp(ymdL(d), to, 'Реклама', 'Meta', Math.round(80 + rnd() * 40), 'USD', 'Facebook + Instagram', 22);
    addExp(ymdL(d), to, 'Реклама', 'TikTok', Math.round(90 + rnd() * 60), 'USD', 'TikTok Ads', 22);
  }
  for (let mm = new Date(start.getFullYear(), start.getMonth(), 1); mm <= today; mm.setMonth(mm.getMonth() + 1)) {
    const last = new Date(mm.getFullYear(), mm.getMonth() + 1, 0);
    addExp(ymdL(mm), ymdL(last), 'SMS-розсилки', null, Math.round(1600 + rnd() * 900), 'UAH', 'Розсилка по базі');
    addExp(ymdL(new Date(mm.getFullYear(), mm.getMonth(), 12)), null, 'Реклама', 'Блогери', Math.round(4000 + rnd() * 5000), 'UAH', 'Інтеграція у блогера', 21);
    addExp(ymdL(mm), ymdL(last), 'Оренда / склад', null, 6000, 'UAH', 'Склад', null);
  }
  const rules = [
    { id: 1, name: 'Єдиний податок 5%', kind: 'percent_revenue', value: 5, category: 'Податки', date_from: null, date_to: null, store_id: null, active: true },
    { id: 2, name: 'ЄСВ за ФОП', kind: 'fixed_monthly', value: 1902.34, category: 'Податки', date_from: null, date_to: null, store_id: null, active: true },
    { id: 3, name: 'SalesDrive + сайт', kind: 'fixed_monthly', value: 2400, category: 'Сервіси (CRM, сайт)', date_from: null, date_to: null, store_id: null, active: true },
    { id: 4, name: 'Пакування (коробка, скотч)', kind: 'per_order', value: 14, category: 'Пакування', date_from: null, date_to: null, store_id: null, active: true },
  ];
  let rid = 5;
  const syncLog = [
    { id: 3, at: new Date(Date.now() - 6 * 60e3).toISOString(), mode: 'cron', orders: 12, pages: 1, ok: true, message: 'Оновлено замовлень: 12' },
    { id: 2, at: new Date(Date.now() - 21 * 60e3).toISOString(), mode: 'cron', orders: 9, pages: 1, ok: true, message: 'Оновлено замовлень: 9' },
    { id: 1, at: new Date(Date.now() - 36 * 60e3).toISOString(), mode: 'cron', orders: 15, pages: 1, ok: true, message: 'Оновлено замовлень: 15' },
  ];

  const inScope = (o, st) => (st != null ? o.sajt === st : (o.sajt == null || stores.find((x) => x.id === o.sajt)?.active !== false));
  const scoped = (st) => orders.filter((o) => inScope(o, st));
  const fin = (o, f) => (f === 'payment' ? (o.payment_date || o.order_date) : o.order_date);
  const inR = (d, a, b) => d >= a && d <= b;
  const group = (list, keyFn, init, add) => { const m = new Map(); for (const x of list) { const k = keyFn(x); if (!m.has(k)) m.set(k, init(k)); add(m.get(k), x); } return [...m.values()]; };
  const R = {
    stats_daily({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const days = new Map();
      const g = (d) => { if (!days.has(d)) days.set(d, { day: d, leads: 0, confirmed: 0, unconfirmed: 0, success: 0, fail: 0, returns: 0, work: 0, sales: 0, revenue: 0, cogs: 0, order_costs: 0, return_costs: 0, payed: 0, upsell: 0, pend_sales: 0, pend_revenue: 0, pend_cogs: 0, pend_costs: 0, refusal_ship: 0, refusal_ship_unknown: 0 }); return days.get(d); };
      for (const o of orders) {
        const c = cat(o); if (c === 'ignore') continue;
        if (inR(o.order_date, p_from, p_to)) { const x = g(o.order_date); x.leads++; x[c === 'return' ? 'returns' : c]++; if (conf(o)) x.confirmed++; else if (c === 'work') x.unconfirmed++; if ((c === 'fail' || c === 'return') && (o.st === undefined)) { if (o.delivery_cost > 0) x.refusal_ship += o.delivery_cost; else if (o.ttn) x.refusal_ship_unknown++; }
          if (c === 'work' && conf(o)) { x.pend_sales++; x.pend_revenue += o.payment_amount; x.pend_cogs += o.cost_price; x.pend_costs += o.shipping_costs + o.commission; } }
        const fd = fin(o, p_fin);
        if (inR(fd, p_from, p_to)) {
          if (c === 'success') { const x = g(fd); x.sales++; x.revenue += o.payment_amount; x.cogs += o.cost_price; x.order_costs += o.shipping_costs + o.commission + o.expenses_amount; x.payed += o.payed_amount; x.upsell += o.upsell_amount; }
          if (c === 'return') g(fd).return_costs += o.shipping_costs + o.commission + o.expenses_amount;
        }
      }
      return [...days.values()].sort((a, b) => a.day.localeCompare(b.day));
    },
    stats_channels({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const m = new Map(); const g = (u) => { u = u || ''; if (!m.has(u)) m.set(u, { utm_source: u, leads: 0, sales: 0, revenue: 0, gross: 0 }); return m.get(u); };
      for (const o of orders) {
        const c = cat(o); if (c === 'ignore') continue;
        if (inR(o.order_date, p_from, p_to)) g(o.utm_source).leads++;
        if (c === 'success' && inR(fin(o, p_fin), p_from, p_to)) { const x = g(o.utm_source); x.sales++; x.revenue += o.payment_amount; x.gross += o.payment_amount - o.cost_price - o.shipping_costs - o.commission - o.expenses_amount; }
      }
      return [...m.values()];
    },
    stats_products({ p_from, p_to, p_fin, p_store }) {
      const m = new Map();
      for (const i of items) {
        const o = byId.get(i.order_id); if (!inScope(o, p_store)) continue; const c = cat(o);
        if (!['success', 'fail', 'return'].includes(c)) continue;
        if (!inR(c === 'success' ? fin(o, p_fin) : o.order_date, p_from, p_to)) continue;
        if (!m.has(i.product_id)) m.set(i.product_id, { product_id: i.product_id, name: i.name, sku: i.sku, sold: 0, refused: 0, returned: 0, revenue: 0, cost: 0, profit: 0 });
        const x = m.get(i.product_id);
        if (c === 'success') { x.sold += i.amount; x.revenue += i.price * i.amount; x.cost += i.cost_price * i.amount; x.profit += (i.price - i.cost_price) * i.amount; }
        else if (c === 'fail') x.refused += i.amount; else x.returned += i.amount;
      }
      return [...m.values()].sort((a, b) => b.profit - a.profit);
    },
    stats_statuses({ p_from, p_to, p_store }) {
      const list = scoped(p_store).filter((o) => inR(o.order_date, p_from, p_to) && cat(o) !== 'ignore');
      return group(list, (o) => o.status_id, (k) => { const s = statuses.find((x) => x.id === k); return { status_id: k, name: s?.name || 'Статус #' + k, category: s?.category || 'work', cnt: 0, amount: 0, sort: s?.sort || 0 }; }, (x, o) => { x.cnt++; x.amount += o.payment_amount; })
        .sort((a, b) => a.sort - b.sort);
    },
    stats_reasons({ p_from, p_to, p_store }) {
      const list = scoped(p_store).filter((o) => inR(o.order_date, p_from, p_to) && ['fail', 'return'].includes(cat(o)));
      return group(list, (o) => o.rejection_reason || '—', (k) => ({ reason: k, fail: 0, returns: 0 }), (x, o) => { if (cat(o) === 'fail') x.fail++; else x.returns++; })
        .sort((a, b) => (b.fail + b.returns) - (a.fail + a.returns));
    },
    stats_payments({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const s = orders.filter((o) => cat(o) === 'success' && inR(fin(o, p_fin), p_from, p_to));
      const back = new Date(p_to + 'T00:00:00Z'); back.setUTCDate(back.getUTCDate() - 90); const b = back.toISOString().slice(0, 10);
      const pend = orders.filter((o) => ['work', 'success'].includes(cat(o)) && o.rest_pay > 0.009 && o.order_date >= b);
      return {
        payed: s.reduce((a, o) => a + o.payed_amount, 0), rest: s.reduce((a, o) => a + o.rest_pay, 0), unpaid_count: s.filter((o) => o.rest_pay > 0.009).length,
        pending_sum: pend.reduce((a, o) => a + o.rest_pay, 0), pending_count: pend.length,
        by_method: group(s, (o) => o.payment_method || '—', (k) => ({ method: k, cnt: 0, amount: 0 }), (x, o) => { x.cnt++; x.amount += o.payment_amount; }).sort((a, b) => b.amount - a.amount),
      };
    },
    stats_managers({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const m = new Map(); const g = (id) => { if (!m.has(id)) m.set(id, { manager_id: id, leads: 0, confirmed: 0, success: 0, fail: 0, returns: 0, sales: 0, revenue: 0, gross: 0, upsell: 0 }); return m.get(id); };
      for (const o of orders) {
        const c = cat(o); if (c === 'ignore') continue;
        if (inR(o.order_date, p_from, p_to)) { const x = g(o.manager_id); x.leads++; if (conf(o)) x.confirmed++; if (c === 'success') x.success++; if (c === 'fail') x.fail++; if (c === 'return') x.returns++; }
        if (c === 'success' && inR(fin(o, p_fin), p_from, p_to)) { const x = g(o.manager_id); x.sales++; x.revenue += o.payment_amount; x.gross += o.payment_amount - o.cost_price - o.shipping_costs - o.commission - o.expenses_amount; x.upsell += o.upsell_amount; }
      }
      return [...m.values()];
    },
    stats_manager_daily({ p_from, p_to, p_fin, p_store }) {
      const list = scoped(p_store).filter((o) => cat(o) === 'success' && inR(fin(o, p_fin), p_from, p_to));
      return group(list, (o) => fin(o, p_fin) + '|' + o.manager_id, (k) => ({ day: k.split('|')[0], manager_id: Number(k.split('|')[1]), sales: 0, upsell: 0 }), (x, o) => { x.sales++; x.upsell += o.upsell_amount; });
    },
    stats_payment_daily({ p_from, p_to, p_store }) {
      const list = scoped(p_store).filter((o) => inR(o.order_date, p_from, p_to) && cat(o) !== 'ignore' && o.payed_amount > 0);
      return group(list, (o) => o.order_date + '|' + o.payment_method, (k) => ({ day: k.split('|')[0], method: k.split('|')[1], cnt: 0, amount: 0 }), (x, o) => { x.cnt++; x.amount += o.payed_amount; });
    },
    payment_methods() { return group(orders, (o) => o.payment_method || '—', (k) => ({ method: k, cnt: 0 }), (x) => { x.cnt++; }).sort((a, b) => b.cnt - a.cnt); },
    stats_fee_daily({ p_from, p_to, p_store }) {
      const list = scoped(p_store).filter((o) => o.payment_method === 'Оплата на картку' && o.payed_amount > 0 && inR(o.order_date, p_from, p_to));
      return group(list, (o) => o.order_date, (k) => ({ day: k, fee: 0, cnt: 0 }), (x, o) => { x.cnt++; x.fee += Math.round(o.payed_amount * 2) / 100; });
    },
    wfp_list({ p_from, p_to }) {
      return orders.filter((o) => o.payment_method === 'Оплата на картку' && o.payed_amount > 0 && inR(o.order_date, p_from, p_to)).slice(-300).reverse().map((o, i) => ({
        id: 'w' + o.id, order_reference: '13894761_' + (1239000000 + o.id), tx_type: 'PURCHASE', status: 'Approved', tx_time: o.order_time.replace(' ', 'T') + '+03:00',
        amount: o.payed_amount, fee: Math.round(o.payed_amount * 2) / 100, payment_system: ['applePay', 'card', 'googlePay'][i % 3], order_id: i % 25 === 7 ? null : o.id, matched_by: 'external_id', sajt: o.sajt, order_date: o.order_date }));
    },
    delivery_sample() {
      return orders.filter((o) => ['fail', 'return'].includes(cat(o)) && o.ttn).slice(-5).reverse().map((o) => ({ id: o.id, order_date: o.order_date, status: statuses.find((x) => x.id === o.status_id)?.name, ttn: o.ttn, sajt: o.sajt, delivery_cost: o.delivery_cost, delivery_json: { trackingNumber: o.ttn, provider: 'novaposhta', cost: o.delivery_cost, statusCode: 102 } }));
    },
    fop_senders() {
      const m = new Map(); for (const o of orders) { if (!o.ttn) continue; const k = o.sajt === 21 ? (o.id % 3 ? '2' : '4') : '3'; const x = m.get(k) || { sender: k, cnt: 0, sample_id: 0, sajt: o.sajt }; x.cnt++; x.sample_id = o.id; m.set(k, x); }
      return [...m.values()].sort((a, b) => b.cnt - a.cnt);
    },
    fop_income({ p_from, p_to }) {
      const m = new Map(); let wfp = 0, wc = 0;
      for (const o of orders) {
        if (cat(o) !== 'success' || !inR(o.payment_date || o.order_date, p_from, p_to)) continue;
        const k = o.sajt === 21 ? (o.id % 3 ? '2' : '4') : '3';
        const pre = o.payment_method === 'Оплата на картку' ? o.payed_amount : 0; wfp += pre; if (pre) wc++;

    const per = N(e.amount_uah) / (daysBetween(e.date, end) + 1);

}
// Розбивка «Інших витрат» по категоріях (для підказки та карток магазинів)
const otherCats = (t) => Object.entries(t.byCat || {}).filter(([c, v]) => c !== 'Реклама' && Math.abs(v) >= 0.5).sort((a, b) => b[1] - a[1]);

    // показники старого дашборду одягу

function bucketKey(d, g) { if (g === 'month') return d.slice(0, 7); if (g === 'week') { const w = (P(d).getUTCDay() + 6) % 7; return addDays(d, -w); } return d; }

}

  ['today', 'Сьогодні'], ['yesterday', 'Вчора'], ['7d', 'Останні 7 днів'], ['30d', 'Останні 30 днів'],
  ['month', 'Цей місяць'], ['prevmonth', 'Минулий місяць'], ['90d', 'Останні 90 днів'], ['year', 'Цей рік'],

function rangeFor(p) {
  const t = new Date(); const to = ymd(t);
  const back = (n) => addDays(to, -n);
  switch (p) {
    case 'today': return [to, to];

    case '30d': return [back(29), to];

const QUICK = 'По днях';
function openAdCell(btn, day, D) {
  document.querySelector('.ad-pop')?.remove();
  const targets = S.store != null ? activeStores().filter((x) => x.id === S.store) : activeStores();
  const list = targets.length ? targets : [{ id: null, name: 'Реклама' }];

  const otherAds = (id) => D.expenses.filter((e) => e.category === 'Реклама' && (e.store_id ?? null) === id && e.date <= day && (e.date_to || e.date) >= day && e !== quickFor(id)).length;
  const pop = document.createElement('div'); pop.className = 'pop ad-pop';
  pop.innerHTML = `<div style="padding:6px 6px 2px"><div style="font-weight:650">Реклама за ${fdate(day)}</div><div class="muted small">Сума за день по кожному магазину</div></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px 6px">
      <label class="f">Канал<select id="apCh">${(S.settings.ad_channels || ['Meta']).map((c) => `<option ${c === ch ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="f">Валюта<select id="apCur">${['USD', 'UAH', 'EUR'].map((c) => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    </div>
    <div id="apRows" style="display:flex;flex-direction:column;gap:8px;padding:0 6px 8px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;padding:4px 6px 6px"><button class="btn sm" id="apCancel">Скасувати</button><button class="btn sm primary" id="apSave">Зберегти</button></div>`;
  const drawRows = () => {
    const chv = $('#apCh', pop).value;
    $('#apRows', pop).innerHTML = list.map((x) => {
      const q = D.expenses.find((e) => e.category === 'Реклама' && e.comment === QUICK && e.date === day && !e.date_to && (e.store_id ?? null) === x.id && (e.channel || '') === chv);
      const others = otherAds(x.id);
      return `<label class="f">${esc(x.name || 'Сайт #' + x.id)}${others ? ` <span class="muted small">(ще є ${others} запис(и) реклами на цей день)</span>` : ''}<input type="text" inputmode="decimal" data-ap="${x.id ?? ''}" data-eid="${q?.id ?? ''}" value="${q ? nf2.format(N(q.amount)).replace(/\s/g, '') : ''}" placeholder="0"></label>`;
    }).join('');
    $('#apRows input', pop)?.focus();
  };
  document.body.appendChild(pop);
  pop.style.position = 'fixed'; pop.style.width = '300px'; pop.style.zIndex = '60';
  drawRows();
  const rc = btn.getBoundingClientRect(), ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(rc.right - 300, innerWidth - 308)) + 'px';
  pop.style.top = (rc.bottom + 6 + ph > innerHeight ? Math.max(8, rc.top - ph - 6) : rc.bottom + 6) + 'px';
  const onScroll = () => close(); window.addEventListener('scroll', onScroll, { once: true, capture: true });
  $('#apCh', pop).addEventListener('change', drawRows);
  const close = () => pop.remove();
  $('#apCancel', pop).addEventListener('click', close);
  pop.addEventListener('click', (e) => e.stopPropagation());
  pop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); if (e.key === 'Enter') $('#apSave', pop).click(); });
  $('#apSave', pop).addEventListener('click', async () => {
    const chv = $('#apCh', pop).value, curv = $('#apCur', pop).value;
    store.set('adCh', chv); store.set('adCur', curv);
    try {
      for (const inp of $$('[data-ap]', pop)) {
        const v = parseFloat(inp.value.replace(/\s/g, '').replace(',', '.'));
        const id = inp.dataset.eid ? N(inp.dataset.eid) : null;
        const storeId = inp.dataset.ap === '' ? null : N(inp.dataset.ap);
        if (!Number.isFinite(v) || v <= 0) { if (id) await api.remove('expenses', id); continue; }
        const row = { date: day, date_to: null, category: 'Реклама', channel: chv, amount: v, currency: curv, rate: rateFor(curv), comment: QUICK, store_id: storeId };
        if (id) await api.update('expenses', id, row); else await api.insert('expenses', row);
        if (storeId != null) await fixCpo(day, storeId, v * rateFor(curv));
      }
      close(); S.data = null; toast('Рекламу збережено'); render();
    } catch (e) { toast(e.message, true); }
  });
  setTimeout(() => document.addEventListener('click', function h(ev) { if (!pop.contains(ev.target)) { close(); document.removeEventListener('click', h); } }), 0);
}

// «CPO план»: при першому внесенні реклами за день фіксуємо рекламу і кількість підтверджених замовлень
// цього магазину на цей момент (як у старому дашборді одягу). Далі не змінюється.
async function fixCpo(day, storeId, adsUah) {
  try {
    const ex = (await api.rows('daily_manual', { store_id: storeId, day }))[0];
    if (ex && N(ex.cpo_orders) > 0) return;
    const r = (await api.rpc('stats_daily', { p_from: day, p_to: day, p_fin: fin(), p_store: storeId }))[0];
    const conf = N(r?.confirmed);
    if (!conf || !adsUah) return;
    await api.upsert('daily_manual', { store_id: storeId, day, cpo_ads: Math.round(adsUah * 100) / 100, cpo_orders: conf }, 'store_id,day');
  } catch (e) { console.warn('CPO', e); }
}

// ================================================================ МЕНЕДЖЕРИ
// З/п менеджера (як у старому дашборді одягу):
//   ставка × замовлення, які стали підтвердженими або відмовою (за датою заявки)
//   + % від допродажу по викуплених замовленнях. Допродаж можна виправити вручну за конкретний день.
// ================================================================ ГРАФІК ЗМІН
// Хто працював — з CRM: менеджер, на якого записані замовлення в робочі години (нічні замовлення CRM віддає наступній зміні).
// Майбутні дні — план 2/2 від останньої фактичної зміни; ручна відмітка (shift_plan) має пріоритет.
const MGR_PALETTE = ['#7F77DD', '#D4537E', '#1D9E75', '#D85A30', '#378ADD', '#888780'];
function mgrColor(id) {
  const c = (S.settings.manager_colors || {})[N(id)];
  if (c && /^#[0-9a-f]{3,8}$/i.test(c)) return c;
  const i = S.managers.findIndex((m) => m.id === N(id)); return MGR_PALETTE[(i < 0 ? 5 : i) % MGR_PALETTE.length];
}
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
const MON_FULL = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
function shiftHours(day) {
  const h = S.settings.shift_hours || { wd: ['09:00', '19:30'], sun: ['10:00', '19:30'] };
  return (P(day).getUTCDay() === 0 ? h.sun : h.wd) || ['09:00', '19:30'];
}
// Хто працював у день: за замовленнями в робочі години (≥5 і ≥20% дня); для архіву (без годин) — ≥35%
function whoWorked(rows) {
  const arch = rows.some((r) => r.archived);
  const val = (r) => N(arch ? r.orders : r.in_hours);
  const total = rows.reduce((s, r) => s + val(r), 0);
  return rows.filter((r) => val(r) >= 5 && val(r) >= total * (arch ? 0.35 : 0.2)).sort((a, b) => val(b) - val(a)).map((r) => N(r.manager_id));
}
async function shiftCalendar(box) {
  const month = S.shiftMonth || ymd(new Date()).slice(0, 7);
  const from = month + '-01', last = addDays(from, dim(from) - 1), today = ymd(new Date());
  // Для плану 2/2 потрібні і попередні дні — беремо 14 днів до початку місяця (або до сьогодні, якщо місяць майбутній)
  const factTo = last < today ? last : today;
  const lookFrom = addDays((from < today ? from : today), -14);
  box.innerHTML = '<div class="card shift-card"><div class="empty">Завантажую графік…</div></div>';
  let rows = [], plan = [];
  try { [rows, plan] = await Promise.all([api.rpc('stats_shifts', { p_from: lookFrom, p_to: factTo }), api.rows('shift_plan').catch(() => [])]); }
  catch (e) { box.innerHTML = `<div class="card shift-card"><div class="empty">Графік не завантажився: ${esc(e.message)}</div></div>`; return; }
  const byDay = {};
  for (const r of rows) (byDay[String(r.day).slice(0, 10)] = byDay[String(r.day).slice(0, 10)] || []).push(r);
  const planMap = Object.fromEntries((plan || []).map((p) => [String(p.day).slice(0, 10), p.manager_id == null ? null : N(p.manager_id)]));
  const rot = (Array.isArray(S.settings.shift_rotation) ? S.settings.shift_rotation : [4, 5]).map(N);
  const fact = (d) => (d <= today && byDay[d] ? whoWorked(byDay[d]) : []);
  // Опора для 2/2: остання фактична зміна до сьогодні, де працювала людина з ротації
  // Проходимо дні по черзі: факт з CRM і ручні відмітки задають, хто на зміні; решта — продовження 2/2 від останньої зміни.
  // Якщо хтось відпрацював 3-й день або вийшов на 1 день — цикл 2/2 перераховується саме від цього місця.
  const isFact = (d) => d < today || (d === today && fact(d).length > 0);
  const proj = {}; let cur = null, streak = 0;
  const step = () => { if (cur == null || rot.length < 2) return; if (streak >= 2) { cur = rot[(rot.indexOf(cur) + 1) % rot.length]; streak = 1; } else streak++; };
  const setTo = (id) => { streak = id === cur ? streak + 1 : 1; cur = id; };
  for (let d = lookFrom; d <= last; d = addDays(d, 1)) {
    if (isFact(d)) { const w = fact(d); const r = w.find((id) => rot.includes(id)); if (r != null) setTo(r); else if (w.length) step(); continue; }
    if (d in planMap) { const m = planMap[d]; if (m != null && rot.includes(m)) setTo(m); else if (m != null) step(); proj[d] = { id: m, manual: true }; continue; }
    step(); proj[d] = cur == null ? null : { id: cur, manual: false };
  }
  const planned = (d) => proj[d] || null;
  const cells = []; const lead = (P(from).getUTCDay() + 6) % 7;
  const sum = {}; const add = (id, k, v = 1) => { (sum[id] = sum[id] || { shifts: 0, orders: 0, planned: 0, subs: 0 })[k] += v; };
  for (let i = 0; i < dim(from); i++) {
    const d = addDays(from, i), w = fact(d), rs = byDay[d] || [];
    const todayNoFact = d === today && !w.length;
    let kind, ids, p = null;
    if (d < today || (d === today && w.length)) { kind = 'fact'; ids = w; }
    else { kind = 'plan'; p = planned(d); ids = p && p.id != null ? [p.id] : []; }
    if (kind === 'fact') { for (const id of ids) { add(id, 'shifts'); add(id, 'orders', N((rs.find((r) => N(r.manager_id) === id) || {}).orders)); if (!rot.includes(id)) add(id, 'subs'); } }
    else if (ids.length) add(ids[0], 'planned');
    cells.push({ d, kind, ids, rs, manual: p?.manual, off: kind === 'plan' && p && p.id == null, todayNoFact });
  }
  const cellHtml = (c) => {
    const day = +c.d.slice(8, 10), [h1, h2] = shiftHours(c.d);
    const cls = ['sh-d', c.kind, c.d === today ? 'today' : '', c.ids.length > 1 ? 'split' : ''].join(' ');
    const col = c.ids.map(mgrColor);
    const style = col.length === 1 ? `--c:${col[0]}` : col.length > 1 ? `--c:${col[0]};--c2:${col[1]}` : '';
    const ord = c.ids.length > 1 ? [...c.ids].sort((a, b) => (rot.includes(b) ? 1 : 0) - (rot.includes(a) ? 1 : 0)) : c.ids;
    const names = ord.map((id) => { const n = mgrName(id); return ord.length > 1 && n.length > 6 ? n.slice(0, 3) + '.' : n; }).map(esc).join(' + ');
    const inH = (id) => N((c.rs.find((r) => N(r.manager_id) === id) || {}).orders);
    const sub = c.kind === 'fact' ? (c.ids.length ? `${int(c.ids.reduce((s, id) => s + inH(id), 0))} замовл.` : (c.rs.length ? 'мало даних' : 'немає замовлень'))
      : c.off ? 'вихідний' : c.ids.length ? (c.manual ? 'відмічено' : 'план 2/2') : '';
    const subst = c.kind === 'fact' && c.ids.some((id) => !rot.includes(id));
    return `<button class="${cls}" style="${style}" data-shd="${c.d}"><span class="sh-n">${day}${c.manual ? ' <i class="sh-pin" title="Відмічено вручну"></i>' : ''}</span>
      <span class="sh-nm"><span class="full">${names || (c.off ? '—' : '')}</span><span class="short">${ord.map((id) => esc(mgrName(id).slice(0, ord.length > 1 ? 1 : 3))).join('+') || (c.off ? '—' : '')}</span></span><span class="sh-s">${subst ? '<b>підміна</b> · ' : ''}${sub}</span><span class="sh-h">${h1}–${h2}</span></button>`;
  };
  const mgrIds = [...new Set([...rot, ...Object.keys(sum).map(N)])].filter((id) => rot.includes(id) || (sum[id] && (sum[id].shifts || sum[id].planned)));

// Бачить лише власник: доступ перевіряє база (is_owner), PIN — додатковий замок в інтерфейсі.
async function sha256(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
function vaultLock(msg = '') {
  const setup = !S.vaultPin;
  $('#page').innerHTML = `<div class="card" style="max-width:380px;margin:40px auto;text-align:center">
    <div style="font-size:30px">🔒</div><h2 class="card-t" style="margin:6px 0 4px">${setup ? 'Створіть PIN-код' : 'Введіть PIN-код'}</h2>
    <div class="muted small" style="margin-bottom:14px">${setup ? 'Від 4 до 8 цифр. Його знатимете лише ви.' : 'Особистий розділ власника'}</div>
    <form id="pinF" style="display:flex;flex-direction:column;gap:10px">
      <input type="password" inputmode="numeric" autocomplete="off" id="pin1" placeholder="PIN" maxlength="8" style="text-align:center;font-size:20px;letter-spacing:.3em">
      ${setup ? '<input type="password" inputmode="numeric" autocomplete="off" id="pin2" placeholder="Повторіть PIN" maxlength="8" style="text-align:center;font-size:20px;letter-spacing:.3em">' : ''}
      <div class="neg small" id="pinErr">${esc(msg)}</div>
      <button class="btn primary" style="justify-content:center">${setup ? 'Зберегти PIN' : 'Відкрити'}</button>
    </form></div>`;
  $('#pin1').focus();
  $('#pinF').addEventListener('submit', async (e) => {
    e.preventDefault(); const p1 = $('#pin1').value.trim();
    if (!/^\d{4,8}$/.test(p1)) { $('#pinErr').textContent = 'PIN — від 4 до 8 цифр'; return; }
    try {
      if (setup) {
        if (p1 !== $('#pin2').value.trim()) { $('#pinErr').textContent = 'PIN-коди не збігаються'; return; }
        const salt = [...crypto.getRandomValues(new Uint8Array(12))].map((x) => x.toString(16).padStart(2, '0')).join('');
        const v = { salt, hash: await sha256(salt + ':' + p1) };
        await api.upsert('owner_vault', { key: 'pin', value: v }, 'key'); S.vaultPin = v; S.vaultOk = true; toast('PIN збережено'); render();
      } else {
        if (await sha256(S.vaultPin.salt + ':' + p1) !== S.vaultPin.hash) { $('#pin1').value = ''; $('#pinErr').textContent = 'Невірний PIN'; return; }
        S.vaultOk = true; render();
      }
    } catch (err) { $('#pinErr').textContent = err.message; }
  });
}
PAGES.vault = async (seq) => {

  $('#page').innerHTML = `

    ${kpi('Особисті витрати', uah(C.exp), C.exp ? usdS(C.exp) : 'немає')}

// ================================================================ ФОП І ПОДАТКИ
PAGES.fop = async (seq) => {
  const nowM = ymd(new Date()).slice(0, 7);
  const m = S.fopMonth || nowM;
  $('#tools').innerHTML = `<label class="f" style="flex-direction:row;align-items:center;gap:8px">Місяць<input type="month" id="fopM" value="${m}" max="${nowM}" class="month-in"></label>`;
  $('#fopM').addEventListener('change', (e) => { S.fopMonth = e.target.value || nowM; render(); });
  const [from, to, monthEnd] = monthRange(m);
  const yFrom = m.slice(0, 4) + '-01-01';
  const [inc, incY, paidRows, receiptsAll, cardList] = await Promise.all([
    api.rpc('fop_income', { p_from: from, p_to: monthEnd }), api.rpc('fop_income', { p_from: yFrom, p_to: monthEnd }),
    api.list('expenses', { eq: { fop_period: m } }).catch(() => []), api.rows('fop_receipts').catch(() => []),
    api.rpc('card_orders', { p_from: from, p_to: monthEnd }).catch(() => []),
  ]);
  if (seq !== renderSeq) return;
  const fops = (S.fops || []).map((f) => ({ ...f, id: N(f.id) }));
  const receipts = (receiptsAll || []).map((r) => ({ ...r, date: String(r.date).slice(0, 10) })).filter((r) => r.date >= from && r.date <= monthEnd).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  // На який ФОП надходять «Оплати на рахунок» кожного магазину (Налаштування → тут, нижче).
  // Якщо не вибрано — ФОП, у якого цей магазин указаний як основний.
  const cardMap = { ...(S.settings.card_fop_by_store || {}) };
  const activeFops = fops.filter((x) => x.active !== false);
  for (const st of activeStores()) if (cardMap[st.id] == null) { const f = activeFops.find((x) => N(x.store_id) === st.id) || (activeFops.length === 1 ? activeFops[0] : null); if (f) cardMap[st.id] = f.id; }
  // Замовлення без сайту — на той самий ФОП, якщо всі магазини платять на один
  const mappedFops = [...new Set(activeStores().map((st) => cardMap[st.id]).filter((v) => v != null && v !== '').map(N))];
  const fopOfStore = (sid) => { if (sid == null || sid === '' || sid === 'null') return mappedFops.length === 1 ? mappedFops[0] : activeFops.length === 1 ? activeFops[0].id : null; return cardMap[N(sid)] == null || cardMap[N(sid)] === '' ? null : N(cardMap[N(sid)]); };
  const incomeOf = (rows, f) => {
    let card = 0, supplier = 0;
    for (const r of rows || []) {
      if (r.kind === 'card' && fopOfStore(r.sender) === f.id) card += N(r.amount);
      if (r.kind === 'supplier' && N(r.sender) === f.id) supplier += N(r.amount);
    }
    return { card, supplier, total: card + supplier };
  };
  const unassigned = (inc || []).reduce((a, r) => a + (r.kind === 'card' && fopOfStore(r.sender) == null ? N(r.amount) : 0), 0);
  const BANKS = ['ПриватБанк', 'Monobank', 'NovaPay'];
  const byBank = (f) => { const m = {}; for (const r of receipts) if (N(r.fop_id) === f.id) m[r.bank || 'Без банку'] = (m[r.bank || 'Без банку'] || 0) + N(r.amount); return Object.entries(m); };
  const cards = fops.map((f) => {
    const mi = incomeOf(inc, f), yi = incomeOf(incY, f);
    const ytd = N(f.income_before) + yi.total;
    const lim = N(f.year_limit), share = lim ? ytd / lim : null;
    const lvl = share == null ? '' : share >= 0.9 ? 'bad' : share >= 0.8 ? 'warn' : 'good';
    const monthTax = fopMonthly(f);
    const paid = (paidRows || []).find((e) => N(e.fop_id) === f.id) || null;
    const stores = activeStores().filter((st) => fopOfStore(st.id) === f.id);
    return { f, mi, ytd, lim, share, lvl, monthTax, paid, stores };
